server {
    listen 80;
    server_name web01.bengtson.local _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache built static assets. Missing asset responses must not be cached,
    # otherwise a stale browser can stay pinned to a failed lazy-loaded chunk.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        error_page 404 = @asset_not_found;
    }

    location @asset_not_found {
        internal;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8000;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
